name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"  # weekly Tuesday 06:00 UTC - catches bit-rot without pushes
                         # (Tuesday keeps this off the fleet's busiest scheduled slot)

permissions:
  contents: read

# One live run per ref: superseded pushes to the same PR/branch are cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # windows-latest: the maintainer's platform, and where the LF-newline
    # handling of the CTL output contract actually needs proving
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check --error-on-warning src scripts tests
      - run: uv run mypy
      - run: uv run deptry src
      - run: uv run pytest -q
        # machine-readable reports for the artifact upload; addopts still
        # enforces the coverage floor
        env:
          PYTEST_ADDOPTS: --cov-report=xml --junit-xml=test-results.xml
      - name: Publish coverage summary
        shell: bash
        run: |
          total=$(uv run coverage report --format=total --precision=2)
          floor=$(sed -n 's/.*--cov-fail-under=\([0-9][0-9]*\).*/\1/p' pyproject.toml)
          echo "Branch coverage: ${total}% (enforced floor: ${floor}%)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
          comment-summary-in-pr: never

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: uv export --locked --no-emit-project --format requirements-txt --output-file requirements-audit.txt > /dev/null
      - run: uvx --from pip-audit==2.10.1 pip-audit --no-deps -r requirements-audit.txt

  secrets-scan:
    # git history scan, OS-independent -> ubuntu (faster)
    # gitleaks is invoked directly in `git` mode (full history) rather than through
    # gitleaks-action, whose range computation fails on the initial push (root^)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full git history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks_8.24.3_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt -o /tmp/checksums.txt
          cd /tmp && grep ' gitleaks_8.24.3_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf /tmp/gitleaks_8.24.3_linux_x64.tar.gz -C /tmp gitleaks
          cd "$GITHUB_WORKSPACE" && /tmp/gitleaks git --redact -v .

  semgrep:
    # standalone CE scan; no cloud account, token, or SARIF upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: uvx semgrep==1.173.0 scan --config p/python --metrics=off --error src scripts

  uv-audit:
    # vulnerability audit of the locked dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: uv audit --locked

  zizmor:
    # static audit of the GitHub Actions workflows themselves; fails on any finding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: uvx zizmor==1.29.0 .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
