name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    # opens/refreshes a release PR from the Conventional Commits;
    # config lives in .github/release-please/ (release-type python bumps
    # pyproject.toml and the CHANGELOG; an extra-files toml updater keeps the
    # governance-tools version in uv.lock in sync with the release -- extra-files
    # paths stay relative to the package path ".", i.e. the repo root).
    # Releases are created as DRAFTS (config "draft": true) because immutable
    # releases lock at publish time; "force-tag-creation": true makes
    # release-please create the tag immediately (GitHub's lazy tag creation
    # would otherwise defer it to publish and break later changelog lookups
    # if a draft ever gets stuck). See ADR-0004.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          # RELEASE_PLEASE_TOKEN is a fine-grained PAT (Contents + Pull
          # requests, read/write). With it, release PRs are pushed as the
          # user and trigger CI like any other branch, so they can satisfy
          # the required status checks of ADR-0009. Until the secret exists
          # this falls back to github.token, which keeps today's behaviour:
          # release PRs carry no CI runs, and the checks rule must NOT be
          # applied live (ADR-0009, phase 2).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  release-assets:
    # when a draft release was just created: build wheel+sdist, export the
    # SPDX SBOM from GitHub's dependency graph, checksum everything, attest
    # build provenance (SLSA), upload the lot to the DRAFT release and only
    # then publish it -- so the release becomes immutable WITH its assets
    # (draft-then-publish flow; release_created and tag_name fire for draft
    # releases too, and gh addresses drafts by pending tag name)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - name: Export SPDX SBOM from the dependency graph
        run: gh api "repos/$REPO/dependency-graph/sbom" --jq .sbom > dist/sbom.spdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
      - name: Write SHA-256 checksums
        run: sha256sum * > SHA256SUMS
        working-directory: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload assets to the draft release
        run: gh release upload "$TAG" dist/* --clobber -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
      - name: Publish the release (locks it immutable, with assets in place)
        run: gh release edit "$TAG" --draft=false -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
