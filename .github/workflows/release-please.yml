name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    # opens/refreshes a release PR from the Conventional Commits;
    # config lives in .github/release-please/ (release-type python bumps
    # pyproject.toml and the CHANGELOG; an extra-files toml updater keeps the
    # governance-tools version in uv.lock in sync with the release -- extra-files
    # paths stay relative to the package path ".", i.e. the repo root).
    # Releases are created as DRAFTS (config "draft": true) because immutable
    # releases lock at publish time; "force-tag-creation": true makes
    # release-please create the tag immediately (GitHub's lazy tag creation
    # would otherwise defer it to publish and break later changelog lookups
    # if a draft ever gets stuck). See fld-forge/pi-config ADR-0009, the
    # reference for this release flow.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mints an installation token for the fld-forge-release GitHub App
      # (Contents + Pull requests, read/write): it expires in an hour, is
      # revoked when the job ends, and belongs to the organization rather
      # than to a maintainer's account, so it survives their PAT expiring.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Without these the token inherits every permission the installation
          # holds; naming them narrows it to what release-please actually does
          # (push the release branch, open the release PR and label it). The
          # installation grants exactly these two today, so the narrowing binds
          # nothing yet: it caps the token if the app is ever granted more.
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          # Release PRs are pushed as the app, so they trigger CI like any
          # other branch and can satisfy the required status checks of
          # ADR-0009. Deliberately no "|| github.token" fallback: pushes made
          # with that token trigger no workflow at all (GitHub
          # anti-recursion), so falling back would silently open release PRs
          # carrying no checks. A token that cannot be minted has to fail the
          # job instead.
          token: ${{ steps.app-token.outputs.token }}

  release-assets:
    # when a draft release was just created: build wheel+sdist, export the
    # CycloneDX and SPDX SBOMs, checksum everything, attest
    # build provenance (SLSA), upload the lot to the DRAFT release and only
    # then publish it -- so the release becomes immutable WITH its assets
    # (draft-then-publish flow; release_created and tag_name fire for draft
    # releases too, and gh addresses drafts by pending tag name)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
      - run: uv build
      - name: Remove the dist/.gitignore that uv build creates
        # uv build drops a .gitignore into dist/; "subject-path: dist/*" below
        # would attest it as a stray subject next to the real artifacts
        # (observed on this repository's v0.7.0), so delete it before the
        # SBOM, checksum and attestation steps run.
        run: rm -f dist/.gitignore
      - name: Export CycloneDX SBOM from uv.lock
        # uv-native SBOM, faithful to the exact locked resolution; complements
        # the dependency-graph SPDX export below. The cyclonedx1.5 format is
        # still marked preview by uv, which is why the uv binary is pinned
        # (setup-uv "version:" above must match the version this was tested on).
        run: uv export --frozen --format cyclonedx1.5 --output-file dist/sbom.cdx.json
      - name: Export SPDX SBOM from the dependency graph
        run: gh api "repos/$REPO/dependency-graph/sbom" --jq .sbom > dist/sbom.spdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
      - name: Write SHA-256 checksums
        run: sha256sum * > SHA256SUMS
        working-directory: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*
      - name: Ship the provenance bundle under a discoverable name
        # The action writes its Sigstore bundle to RUNNER_TEMP as
        # "attestation.json", so nothing reaches the release page: Scorecard's
        # Signed-Releases check recognizes provenance only by the asset-name
        # suffix ".intoto.jsonl" (ossf/scorecard, probes/releasesHaveProvenance
        # /impl.go), and a consumer had no bundle to verify offline against.
        # Copying it into dist/ lets the upload step below ship it unchanged.
        # MUST stay after the attestation step: a file sitting in dist/ when
        # "subject-path: dist/*" is evaluated becomes a stray attested subject,
        # exactly like the dist/.gitignore removed above. For the same reason
        # it is absent from SHA256SUMS, which is itself an attested subject and
        # cannot be regenerated afterwards without voiding its own attestation.
        run: cp "$BUNDLE" dist/attestation.intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - name: Upload assets to the draft release
        run: gh release upload "$TAG" dist/* --clobber -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
      - name: Publish the release (locks it immutable, with assets in place)
        run: gh release edit "$TAG" --draft=false -R "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
