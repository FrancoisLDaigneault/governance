[project]
name = "governance-tools"
version = "0.8.0"
description = "Apply and audit the GitHub repository governance baseline across a fleet"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
# >=1.27 for PEP 639 license metadata; <2 so a release build cannot silently
# jump a major version of the build backend (it is not covered by uv.lock)
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governance_tools"]

[dependency-groups]
dev = [
    "deptry>=0.25.1,<0.26",
    "hypothesis>=6.165.10",
    "import-linter>=2.13,<3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "C90", "S", "N", "B", "C4", "SIM", "PERF", "RUF", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests compare literal counts and contents (PLR2004 is noise there) and
# lean on assert by design (S101 is pytest's contract). The gh adapter is the
# one production module allowed to use subprocess; tests are exempt.
"src/governance_tools/gh.py" = ["TID251"]
"tests/*" = ["PLR2004", "S101", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"http.client".msg = "Network APIs are confined to the gh adapter."
"socket".msg = "Network APIs are confined to the gh adapter."
"subprocess".msg = "Subprocess calls are confined to the gh adapter."
"urllib.request".msg = "Network APIs are confined to the gh adapter."
"scripts".msg = "Production modules must not import command wrappers."
"tests".msg = "Production modules must not import test code."

[tool.deptry]
# The runtime package is stdlib-only (dependencies = []) except for the gh
# CLI, which is an external binary, not a Python import; deptry keeps that
# invariant honest by flagging any non-stdlib import that sneaks into src/.

[tool.importlinter]
root_package = "governance_tools"

[[tool.importlinter.contracts]]
name = "Audit and bootstrap orchestrators are independent"
type = "independence"
modules = [
    "governance_tools.audit",
    "governance_tools.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Desired state does not depend on the GitHub adapter"
type = "forbidden"
source_modules = ["governance_tools.baseline"]
forbidden_modules = ["governance_tools.gh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage rides every pytest run (pre-commit, CI, just check).
addopts = "--cov=governance_tools --cov-fail-under=90"

[tool.coverage.run]
# Branch coverage is stricter than line coverage: this tool mutates repository
# settings, so every untested conditional is a real risk.
branch = true

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python-version = "3.12"

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
python_version = "3.12"

[tool.pyright]
# point pyright-based checkers (including editor integrations) at the uv venv
venvPath = "."
venv = ".venv"
