[project]
name = "governance-tools"
version = "0.7.0"
description = "Apply and audit the GitHub repository governance baseline across a fleet"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/governance_tools"]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests compare literal counts and contents: PLR2004 is noise there.
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage rides every pytest run (pre-commit, CI, just check).
addopts = "--cov=governance_tools --cov-fail-under=90"

[tool.coverage.run]
# Branch coverage is stricter than line coverage: this tool mutates repository
# settings, so every untested conditional is a real risk.
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
python_version = "3.12"

[tool.pyright]
# point pyright-based checkers (including editor integrations) at the uv venv
venvPath = "."
venv = ".venv"
